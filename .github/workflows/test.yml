name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 6"

jobs:
  test:
    name: Test on linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chaldea code
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: "pubspec.yaml"
          cache: true

      - name: flutter version & pub get
        run: |
          flutter --version
          flutter pub get

      # Static checks run first; the test steps below are skipped if any of them fails.
      - name: Verify dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Dart Analyze
        if: always()
        run: dart analyze

      - name: l10n generation
        if: always()
        run: dart run intl_utils:generate

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev pkg-config cmake ninja-build libblkid-dev

      - name: flutter doctor
        run: |
          flutter config --enable-linux-desktop
          flutter doctor -v

      - name: Checkout chaldea data
        uses: actions/checkout@v6
        with:
          repository: chaldea-center/chaldea-data
          path: data/

      - run: mv data/dist data/game

      - run: flutter test -d linux --dart-define=APP_PATH=$GITHUB_WORKSPACE/data/

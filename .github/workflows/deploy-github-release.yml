name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# One release build per ref at a time. Beta builds (main) supersede each other,
# tagged releases are never cancelled half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Least privilege by default; only publish-release escalates to `contents: write`.
permissions:
  contents: read

jobs:
  create-build:
    name: Create ${{ matrix.target }} build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        target: [windows, linux, android]
        include:
          # - os: macos-latest
          #   target: macOS
          #   build_target: macos
          #   build_path: build/macos/Build/Products/Release
          - os: windows-latest
            target: windows
            build_target: windows
            build_path: build\windows\x64\runner\Release
          - os: ubuntu-latest
            target: linux
            build_target: linux
            build_path: build/linux/x64/release/bundle
          - os: ubuntu-latest
            target: android
            build_target: apk
            build_path: build/app/outputs
      fail-fast: false
    steps:
      - name: Checkout chaldea code
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: "pubspec.yaml"
          cache: true

      # All desktop targets default to `on` since Flutter 3.16, so the old
      # `flutter config --enable-{linux,macos,windows}-desktop` calls are gone.
      - name: Disable CLI animations
        run: flutter config --no-cli-animations

      - name: Get Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
              echo "VERSION=beta" >> $GITHUB_ENV
          fi
      - run: echo "VERSION = $VERSION"
        shell: bash
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev
          sudo apt-get install -y libayatana-appindicator3-dev

      # JDK 17 is the minimum required by AGP 8.12 / Gradle 9 and matches
      # compileOptions + kotlinOptions jvmTarget in android/app/build.gradle.kts.
      - name: Install Android dependencies
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: flutter doctor
        if: matrix.target != 'windows'
        run: flutter doctor -v

      - name: Configure Keystore for Android
        if: matrix.target == 'android'
        run: |
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" >> key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        working-directory: android

      # --global instead of --system: writing to the system gitconfig needs
      # elevated privileges, which is not guaranteed on every runner image.
      - name: Enable long path on Windows
        if: matrix.target == 'windows'
        run: git config --global core.longpaths true

      - name: Generate git info
        run: dart ./scripts/gen_git_info.dart

      - run: flutter pub get
      # Patch may rewrite pubspec.yaml (fdroid flavor), so resolve again after.
      - run: dart ./scripts/patch_before_build.dart ${{ matrix.target }} ${{ github.ref }}
      - run: flutter pub get

      - name: Build release (non-android)
        if: matrix.target != 'android'
        run: flutter build ${{ matrix.build_target }} -v --release

      - name: Build release (Android APK+AAB)
        if: matrix.target == 'android'
        run: |
          flutter build ${{ matrix.build_target }} -v --release --flavor=github
          flutter build appbundle -v --release --flavor=play

      # Package the build.
      - name: Copy VC redistributables to release directory for Windows
        if: matrix.target == 'windows'
        run: |
          Copy-Item (vswhere -latest -find 'VC\Redist\MSVC\*\x64\*\msvcp140.dll') .
          Copy-Item (vswhere -latest -find 'VC\Redist\MSVC\*\x64\*\vcruntime140.dll') .
          Copy-Item (vswhere -latest -find 'VC\Redist\MSVC\*\x64\*\vcruntime140_1.dll') .
        working-directory: ${{ matrix.build_path }}
      - name: Rename build for Android
        if: matrix.target == 'android'
        run: |
          mv flutter-apk/app-github-release.apk $GITHUB_WORKSPACE/chaldea-$VERSION-${{ matrix.target }}.apk
          mv bundle/playRelease/app-play-release.aab $GITHUB_WORKSPACE/chaldea-$VERSION-appbundle.aab
        working-directory: ${{ matrix.build_path }}
      - name: Compress build for Linux
        if: matrix.target == 'linux'
        run: |
          cp $GITHUB_WORKSPACE/linux/README.md ./README.txt
          cp "${GITHUB_WORKSPACE}/res/release_docs/安装与升级说明-InstallAndUpgrade.txt" .
          if [ -f ../plugins/flutter_js/bundle/lib/libquickjs_c_bridge_plugin.so ]; then
            cp ../plugins/flutter_js/bundle/lib/libquickjs_c_bridge_plugin.so ./lib/libquickjs_c_bridge_plugin.so
            echo "Copied libquickjs_c_bridge_plugin.so"
          else
            echo "WARN: libquickjs_c_bridge_plugin.so not found, skip copy"
          fi
          echo "== Files to package (Linux) =="
          ls -lhR
          echo "==============================="
          tar czf $GITHUB_WORKSPACE/chaldea-$VERSION-${{ matrix.target }}.tar.gz *
        working-directory: ${{ matrix.build_path }}
      - name: Compress build for macOS
        if: matrix.target == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent Chaldea.app $GITHUB_WORKSPACE/chaldea-$VERSION-${{ matrix.target }}.zip
        working-directory: ${{ matrix.build_path }}
      - name: Compress build for Windows
        if: matrix.target == 'windows'
        run: |
          cp ${env:GITHUB_WORKSPACE}/windows/README.md ./README.txt
          Copy-Item "${env:GITHUB_WORKSPACE}/res/release_docs/安装与升级说明-InstallAndUpgrade.txt" .
          Write-Output "== Files to package (Windows) =="
          Get-ChildItem -Recurse -Force | Sort-Object FullName | ForEach-Object {
            if ($_.PSIsContainer) {
              "[DIR ] $($_.FullName)"
            } else {
              "[FILE] $($_.Length) $($_.FullName)"
            }
          }
          Write-Output "================================"
          compress-archive -Path * -DestinationPath ${env:GITHUB_WORKSPACE}\chaldea-${env:VERSION}-${{ matrix.target }}.zip
        working-directory: ${{ matrix.build_path }}

      - name: Generate Release Note
        if: matrix.target == 'android'
        run: dart ./scripts/release_note.dart ${{ env.VERSION }} release-note.md
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chaldea-${{ env.VERSION }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ./chaldea-${{ env.VERSION }}-*
            release-note.md

  publish-release:
    name: Publish Release
    needs: create-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Get Date
        id: get-date
        run: echo "date=$(/bin/date -u +"%Y/%m/%d %H:%M:%S %Z")" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
      - name: Move to dist & create checksums
        run: |
          ls -l -R
          mkdir dist
          mv chaldea-*/chaldea-* dist/
          pushd dist
          shopt -s nullglob
          shasum -a 256 chaldea-*.{apk,aab,zip,gz} > checksums.txt
          cat checksums.txt
          ls -l
          popd

      - name: Get Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
              echo "VERSION=beta" >> $GITHUB_ENV
          fi

      - name: Delete previous beta build
        if: github.ref == 'refs/heads/main'
        run: gh release delete beta -R ${{ github.repository }} -y --cleanup-tag || echo "delete beta failed"
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}

      - name: Publish Beta
        id: release-beta
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          name: beta
          tag_name: beta
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          body: Built at ${{ steps.get-date.outputs.date }}
          body_path: chaldea-${{ env.VERSION }}-android/release-note.md
          files: "dist/*"

      - name: Publish Stable
        id: release-stable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          body: Built at ${{ steps.get-date.outputs.date }}
          body_path: chaldea-${{ env.VERSION }}-android/release-note.md
          files: "dist/*"

      - name: Check draft status
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
          RELEASE_ID: ${{ steps.release-beta.outputs.id || steps.release-stable.outputs.id }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          TOKEN=$GITHUB_TOKEN

          sleep 15

          response=$(curl -Ls -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$OWNER/$REPO/releases/$RELEASE_ID")

          echo "$response"

          is_draft=$(echo "$response" | jq '.draft')

          if [ "$is_draft" = true ]; then
            response2=$(curl -L -X PATCH -H "Authorization: Bearer $TOKEN" --data '{"draft":false}' "https://api.github.com/repos/$OWNER/$REPO/releases/$RELEASE_ID")
            echo "Publish draft: $(echo "$response2" | jq '.draft')"
          else
            echo "Already published"
          fi
